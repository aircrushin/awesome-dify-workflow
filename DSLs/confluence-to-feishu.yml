    - data:
        code: "import json\n\n\ndef _name_from_email(email: str) -> str:\n    \"\"\
          \"Extract display name from email: peter.han@dify.ai -> Peter Han\"\"\"\n\
          \    local = email.split(\"@\")[0] if \"@\" in email else email\n    parts\
          \ = local.replace(\"_\", \".\").replace(\"-\", \".\").split(\".\")\n   \
          \ return \" \".join(p.capitalize() for p in parts if p)\n\n\ndef main(payload:\
          \ str) -> dict:\n    data = json.loads(payload) if isinstance(payload, str)\
          \ else payload\n    if \"body\" in data and \"method\" in data:\n      \
          \  data = data[\"body\"]\n\n    page = data.get(\"page\", {})\n    blogpost\
          \ = data.get(\"blogpost\", {})\n    mentions = data.get(\"mentions\", {})\n\
          \    if blogpost.get(\"title\"):\n        title, url, content_type = blogpost[\"\
          title\"], blogpost.get(\"url\", \"\"), \"Blog Post\"\n        author_email\
          \ = blogpost.get(\"author\", \"\") or \"Someone\"\n    else:\n        title,\
          \ url, content_type = page.get(\"title\", \"Untitled\"), page.get(\"url\"\
          , \"\"), \"Page\"\n        author_email = page.get(\"author\", \"\") or\
          \ \"Someone\"\n    author = _name_from_email(author_email)\n\n    email\
          \ = mentions.get(\"email\", \"Unknown\")\n    card = {\n        \"config\"\
          : {\"wide_screen_mode\": True},\n        \"header\": {\n            \"title\"\
          : {\"tag\": \"plain_text\", \"content\": \"\U0001F4E2 Confluence Mention\"\
          },\n            \"template\": \"blue\",\n        },\n        \"elements\"\
          : [\n            {\n                \"tag\": \"div\",\n                \"\
          text\": {\n                    \"tag\": \"lark_md\",\n                 \
          \   \"content\": f\"**{author}** mentioned you in a {content_type}\",\n\
          \                },\n            },\n            {\"tag\": \"hr\"},\n  \
          \          {\n                \"tag\": \"div\",\n                \"text\"\
          : {\n                    \"tag\": \"lark_md\",\n                    \"content\"\
          : f\"**\U0001F4C4 {content_type}:** [{title}]({url})\",\n              \
          \  },\n            },\n            {\"tag\": \"hr\"},\n            {\n \
          \               \"tag\": \"action\",\n                \"actions\": [\n \
          \                   {\n                        \"tag\": \"button\",\n  \
          \                      \"text\": {\"tag\": \"plain_text\", \"content\":\
          \ f\"View {content_type}\"},\n                        \"url\": url,\n  \
          \                      \"type\": \"primary\",\n                    }\n \
          \               ],\n            },\n            {\n                \"tag\"\
          : \"note\",\n                \"elements\": [\n                    {\"tag\"\
          : \"plain_text\", \"content\": \"Confluence → Dify Notification\"},\n  \
          \              ],\n            },\n        ],\n    }\n\n    return {\n \
          \       \"email\": email,\n        \"content\": json.dumps(card, ensure_ascii=False),\n\
          \    }\n"
